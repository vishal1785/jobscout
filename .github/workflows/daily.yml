name: scout

on:
  schedule:
    - cron: '30 2 * * *'      # 08:00 IST (GitHub may start it 10-30 minutes late)
  workflow_dispatch:           # the Run workflow button

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: read               # the run writes nothing back to this public repo

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # runs the TypeScript directly, no build step

      - name: Find roles, prepare, notify
        env:
          JOBSCOUT_SITE: ${{ secrets.JOBSCOUT_SITE }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOBSCOUT_REPORT_URL: ${{ secrets.JOBSCOUT_REPORT_URL }}
        run: node src/index.ts
