name: scout

on:
  schedule:
    # Backup only. The morning run is started by Vercel's cron (api/kick.js),
    # because GitHub's scheduler is best-effort and has run hours late. An
    # off-peak minute, after the main run: if that one already ran, this one
    # finds nothing new and sends nothing.
    - cron: '13 4 * * *'      # 09:43 IST
  workflow_dispatch:           # the Run workflow button

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: read               # the run writes nothing back to this public repo

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # runs the TypeScript directly, no build step

      - name: Find roles, prepare, notify
        env:
          JOBSCOUT_SITE: ${{ secrets.JOBSCOUT_SITE }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOBSCOUT_REPORT_URL: ${{ secrets.JOBSCOUT_REPORT_URL }}
        run: node src/index.ts
